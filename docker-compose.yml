# Local stack: Postgres, Redis, a one-off migration, the API, one worker and the review app.
#   ANTHROPIC_API_KEY=... docker compose up --build
# The review app has no SSO gateway in front of it here; put one in front (or use `npm run demo`
# in api/ for a self-contained demo with a simulated model).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contentloom
      POSTGRES_PASSWORD: contentloom
      POSTGRES_DB: contentloom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contentloom']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  migrate:
    build: ./api
    command: ['node', 'dist/src/migrate.main.js']
    environment: &api-env
      DATABASE_URL: postgres://contentloom:contentloom@postgres:5432/contentloom
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTO_APPROVE_AT: '0.85'
      SAMPLE_RATE: '0.1'
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-50}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    environment:
      <<: *api-env
      PORT: '3001'
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./api
    command: ['node', 'dist/src/worker.main.js']
    environment:
      <<: *api-env
      SCHEDULER_ENABLED: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  review:
    build:
      context: ./review
      args:
        CONTENTLOOM_API: http://api:3001
    ports:
      - '3002:3002'
    depends_on:
      - api

volumes:
  pgdata:
